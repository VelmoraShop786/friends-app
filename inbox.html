<!DOCTYPE html>
<html lang="en" class="rk-boot">
<head>
<style>
  /* ---- boot overlay: hides the page's static placeholder markup until real data is applied ---- */
  html.rk-boot body > *:not(#rk-boot){ visibility:hidden !important; }
  #rk-boot{
    position:fixed; inset:0; z-index:999999; visibility:visible !important;
    background:var(--bg,#f4fbf8); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    font-family:'Inter',system-ui,sans-serif; font-weight:600; font-size:0.95rem; color:var(--ink,#123b2e); text-align:center; padding:24px;
  }
  #rk-boot .rk-boot-spin{
    width:40px; height:40px; border-radius:50%;
    border:4px solid color-mix(in srgb, var(--teal-deep,#05846a) 25%, transparent); border-top-color:var(--teal-deep,#05846a);
    animation:rkbootspin .8s linear infinite;
  }
  @keyframes rkbootspin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ #rk-boot .rk-boot-spin{ animation-duration:2.4s; } }
</style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox</title>
<link rel="stylesheet" href="fallback-fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-deep: #05846a;
    --teal: #06D6A0;
    --teal-soft: #d3f3e8;
    --blue: #118AB2;
    --bg: #f6faf8;
    --card: #ffffff;
    --ink: #16332c;
    --ink-soft: #5c7770;
    --line: #dfeee8;
    --bubble-them: #eef6f3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  *, *::before, *::after{
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  input, textarea{
    -webkit-user-select:text; -moz-user-select:text; -ms-user-select:text; user-select:text;
    -webkit-touch-callout:default;
  }
  .copyable, .copyable *{
    -webkit-user-select:text !important; -moz-user-select:text !important; -ms-user-select:text !important; user-select:text !important;
    -webkit-touch-callout:default !important;
  }
html, body{ overscroll-behavior-y: contain; }
  body{
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    display:flex;
    justify-content:center;
  }

  .phone{
    width:100%;
    max-width: 420px;
    min-height:100vh;
    background: var(--card);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* ---------- Chat list screen ---------- */

  .list-header{
    padding: 22px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .list-header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.6rem;
  }
  .new-chat-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background: var(--teal-deep);
    color:white;
    font-size:1.2rem;
    cursor:pointer;
  }

  .search-pill{
    margin: 0 20px 14px;
    background: var(--teal-soft);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.88rem;
    color: var(--ink-soft);
  }

  .chat-list{ flex:1; overflow-y:auto; padding: 4px 8px 20px; }
  .chat-row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 12px;
    border-radius: 14px;
    cursor:pointer;
  }
  .chat-row:hover{ background: var(--bg); }
  .chat-row .avatar{
    width: 50px; height:50px;
    border-radius:50%;
    background: var(--teal-soft);
    color: var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
    flex-shrink:0;
    position:relative;
  }
  .dot{
    position:absolute; bottom:1px; right:1px;
    width:12px; height:12px;
    background:#2ecc71;
    border:2px solid var(--card);
    border-radius:50%;
  }
  .chat-meta{ flex:1; min-width:0; }
  .chat-meta .row1{ display:flex; justify-content:space-between; align-items:baseline; }
  .chat-meta .name{ font-weight:600; font-size:0.95rem; }
  .chat-meta .time{ font-size:0.72rem; color: var(--ink-soft); flex-shrink:0; }
  .chat-meta .preview{
    font-size:0.83rem; color: var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .unread-badge{
    background: var(--teal-deep);
    color:white;
    font-size:0.7rem;
    font-weight:700;
    min-width:20px; height:20px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    padding: 0 6px;
    flex-shrink:0;
  }

  /* ---------- Conversation screen ---------- */
  #screen-chat{ display:flex; flex-direction:column; flex:1; height:100vh; }

  .chat-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 16px 16px;
    border-bottom: 1px solid var(--line);
  }
  .chat-header .avatar{
    width:40px; height:40px;
    border-radius:50%;
    background: var(--teal-soft);
    color: var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
  }
  .chat-header .name{ font-weight:600; font-size:0.95rem; }
  .chat-header .status{ font-size:0.75rem; color: var(--teal-deep); }
  /* Track Friend: centred under the header, only while this friend is in a room */
  .track-bar{ display:none; justify-content:center; padding:8px 12px; background: var(--bg); border-bottom:1px solid var(--line); }
  .track-bar.show{ display:flex; }
  .track-bar button{
    border:0; border-radius:999px; padding:9px 22px; cursor:pointer;
    font:800 0.86rem Inter,system-ui,sans-serif; color:#fff;
    background: linear-gradient(180deg,#19c79a,#05846a);
    box-shadow: 0 3px 0 #046652, 0 4px 8px rgba(0,0,0,0.18);
  }
  .track-bar button:active{ transform: translateY(2px); box-shadow: 0 1px 0 #046652; }
  .icon-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background: transparent;
    color: var(--ink-soft);
    font-size:1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .icon-btn:hover{ background: var(--bg); }

  .messages{
    flex:1;
    overflow-y:auto;
    padding: 18px 14px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background: var(--bg);
  }
  .bubble-row{ display:flex; position:relative; touch-action: pan-y; }
  .bubble-row.me{ justify-content:flex-end; }
  .bubble-row-inner{
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: transform 0.15s ease;
    max-width:100%;
  }
  .bubble-row.me .bubble-row-inner{ flex-direction:row-reverse; }
  .reply-icon{
    width:26px; height:26px;
    border-radius:50%;
    background: var(--teal-soft);
    color: var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    opacity:0;
    transition: opacity 0.15s ease;
  }
  .reply-icon.show{ opacity:1; }
  .bubble{
    max-width: 72%;
    padding: 10px 13px;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height:1.4;
    cursor:pointer;
  }
  .bubble-row.them .bubble{
    background: var(--bubble-them);
    border-bottom-left-radius: 4px;
  }
  .bubble-row.me .bubble{
    background: var(--teal-deep);
    color:white;
    border-bottom-right-radius: 4px;
  }
  /* shared room card (Yalla Ludo style) */
  .bubble-row .bubble.room-card{ background:#fff; color:#16302a; padding:10px 10px 8px; width:262px; max-width:78%; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,0.14); }
  .rsc{ display:flex; gap:10px; align-items:center; }
  .rsc-pic{ width:62px; height:62px; border-radius:10px; overflow:hidden; flex-shrink:0; background:linear-gradient(135deg,var(--teal-deep),var(--teal)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:1.5rem; }
  .rsc-pic img{ width:100%; height:100%; object-fit:cover; max-width:none; border-radius:0; }
  .rsc-info{ min-width:0; }
  .rsc-name{ font-weight:700; font-size:0.95rem; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .rsc-id{ font-size:0.8rem; color:#8a9b96; font-weight:600; margin-top:3px; }
  .rsc-tap{ display:flex; align-items:center; gap:7px; margin-top:9px; font-size:0.82rem; font-weight:600; color:#7d8e89; }
  .rsc-hand{ width:22px; height:22px; border-radius:50%; background:#0fa77f; display:flex; align-items:center; justify-content:center; font-size:0.7rem; }
  .bubble-row .bubble.room-card .bubble-time{ color:#8a9b96; opacity:1; }
  /* Ludo invitation card */
  .bubble-row .bubble.ludo-card{ background:linear-gradient(160deg,#ffffff 0%,#f1fbf7 100%); color:#16302a; padding:12px 12px 8px; width:268px; max-width:80%; border-radius:16px; box-shadow:0 1px 5px rgba(0,0,0,0.16); border:1px solid #cfeadf; }
  .lgc-top{ display:flex; align-items:center; gap:10px; }
  .lgc-ico{ width:46px; height:46px; border-radius:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.7rem; background:linear-gradient(135deg,#ffe27a,#f0a81c); box-shadow:inset 0 -2px 0 rgba(0,0,0,.12); }
  .lgc-ttl{ font-weight:800; font-size:.98rem; line-height:1.2; }
  .lgc-sub{ font-size:.8rem; color:#5d7a72; margin-top:2px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; }
  .lgc-chips{ display:flex; gap:6px; margin:10px 0 9px; flex-wrap:wrap; }
  .lgc-chip{ background:#e4f5ee; color:#0b6b52; font-weight:700; font-size:.76rem; padding:4px 9px; border-radius:20px; }
  .lgc-btn{ width:100%; border:none; border-radius:12px; padding:11px; font:800 .92rem 'Inter',sans-serif; color:#fff; background:linear-gradient(180deg,#14b98d,#0b8f6c); box-shadow:0 2px 0 #086b50; cursor:pointer; }
  .lgc-btn:active{ transform:translateY(1px); box-shadow:0 1px 0 #086b50; }
  .lgc-note{ text-align:center; font-weight:700; font-size:.82rem; color:#8a9b96; padding:6px 0 2px; }
  .bubble-row .bubble.ludo-card .bubble-time{ color:#8a9b96; opacity:1; }
  .lc-back{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:24px; }
  .lc-back.show{ display:flex; }
  .lc-card{ width:100%; max-width:320px; background:#fff; border-radius:20px; padding:22px 20px 18px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .lc-card .lc-ico{ width:60px; height:60px; margin:0 auto 10px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; background:linear-gradient(135deg,#ffe27a,#f0a81c); }
  .lc-card h3{ font-size:1.15rem; margin:0 0 6px; color:#16302a; }
  .lc-card p{ font-size:.9rem; line-height:1.5; color:#5d7a72; margin:0 0 16px; }
  .lc-card button{ width:100%; border:none; border-radius:12px; padding:12px; font:800 .95rem 'Inter',sans-serif; color:#fff; background:var(--teal-deep); cursor:pointer; }
  .bubble-row.me .vmsg{ --vm-ink: var(--teal-deep); }
  .bubble-row.them .vmsg{ --vm-ink: #fff; }
  .bubble img{
    max-width: 220px;
    border-radius: 12px;
    display:block;
  }
  .bubble .reel-tag{
    display:flex; align-items:center; gap:6px;
    font-size:0.78rem;
    margin-top:6px;
    opacity:0.85;
  }
  .bubble-time{
    font-size:0.68rem;
    margin-top:4px;
    opacity:0.7;
    text-align:right;
  }
  .quoted-reply{
    border-left: 3px solid var(--teal-deep);
    background: rgba(0,0,0,0.06);
    border-radius: 8px;
    padding: 5px 8px;
    margin-bottom: 5px;
    font-size: 0.78rem;
    opacity:0.9;
  }
  .bubble-row.me .quoted-reply{ background: rgba(255,255,255,0.18); border-left-color: white; }
  .quoted-reply .q-name{ font-weight:700; }

  /* ---------- Long-press menu on a message: Copy / Reply / Delete ---------- */
  .msg-menu-backdrop{
    display:none; position:fixed; inset:0; z-index:70;
    background: rgba(10,25,20,0.35);
    align-items:flex-end; justify-content:center;
  }
  .msg-menu-backdrop.show{ display:flex; }
  .msg-menu{
    width:100%; max-width:420px; background: var(--card);
    border-radius:18px 18px 0 0; padding: 8px 0 max(8px, env(safe-area-inset-bottom, 0px));
  }
  .msg-menu button{
    display:flex; align-items:center; gap:12px; width:100%; border:none; background:none; cursor:pointer;
    text-align:left; padding: 14px 20px; font-family:'Inter', sans-serif; font-size:0.92rem; color: var(--ink);
  }
  .msg-menu button:active{ background: var(--bg); }
  .msg-menu button.danger{ color:#b1362f; }
  .msg-menu .msg-menu-icon{ width:20px; text-align:center; flex-shrink:0; }


  .reply-preview-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 8px 12px;
    margin: 0 12px;
    background: var(--teal-soft);
    border-left: 3px solid var(--teal-deep);
    border-radius: 8px 8px 0 0;
  }
  .reply-preview-bar.show{ display:flex; }
  .reply-preview-bar .rp-text{ font-size:0.8rem; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reply-preview-bar .rp-name{ font-weight:700; color: var(--teal-deep); }
  .reply-preview-bar button{
    background:none; border:none; color: var(--ink-soft); font-size:1rem; cursor:pointer; flex-shrink:0;
  }

  .block-bar{
    display:none; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; text-align:center;
    padding: 14px 16px; border-top: 1px solid var(--line); background: var(--card);
    font-size:0.86rem; color: var(--ink-soft); line-height:1.4;
  }
  .block-bar button{ border:1.5px solid var(--line); background: var(--card); color: var(--teal-deep); font-weight:600; font-size:0.82rem; padding:8px 16px; border-radius:999px; cursor:pointer; }
  .composer{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    background: var(--card);
  }
  .attach-btn{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background: var(--teal-soft);
    color: var(--teal-deep);
    font-size:1.2rem;
    cursor:pointer;
    flex-shrink:0;
  }
  .composer input[type=text]{
    flex:1;
    border: 1.5px solid var(--line);
    background: #fbfdfc;
    border-radius: 20px;
    padding: 11px 16px;
    font-family:'Inter', sans-serif;
    font-size: 0.9rem;
    outline:none;
    unicode-bidi: plaintext;
  }
  .composer input[type=text]:focus{ border-color: var(--teal); background:#fff; }
  .send-btn{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background: var(--teal-deep);
    color:white;
    font-size:1rem;
    cursor:pointer;
    flex-shrink:0;
  }
  .send-btn:hover{ background:#046c56; }
  .photo-btn{ background:var(--teal-soft); color:var(--teal-deep); margin-left:0; }
  /* photo message */
  .bubble-row .bubble.photo-card{ background:#fff; padding:4px 4px 6px; width:230px; max-width:78%; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,0.16); cursor:pointer; }
  .ph-wrap{ width:100%; border-radius:11px; overflow:hidden; background:#e6efec; }
  .ph-wrap img{ width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none; pointer-events:none; }
  .ph-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 6px 0; }
  .ph-exp{ font-size:.68rem; font-weight:700; color:#7a8f89; }
  .bubble-row .bubble.photo-card .bubble-time{ color:#8a9b96; opacity:1; margin:0; }
  .bubble-row .bubble.photo-card.gone{ cursor:default; background:#f1f5f3; }
  .ph-gone{ text-align:center; padding:22px 10px 12px; color:#6b817a; font-weight:700; font-size:.88rem; }
  .ph-gone .ph-gico{ font-size:1.8rem; opacity:.6; margin-bottom:4px; }
  .ph-gone small{ display:block; font-weight:500; font-size:.7rem; margin-top:3px; color:#8a9b96; }
  /* photo editor + viewer */
  body.pe-open{ overflow:hidden; }
  .pe-back{ position:fixed; inset:0; z-index:300; background:#0b1512; display:flex; flex-direction:column; color:#fff; font-family:'Inter',sans-serif; }
  .pe-back[hidden]{ display:none; }
  .pe-top{ display:flex; align-items:center; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px; }
  .pe-top b{ font-size:1rem; }
  .pe-top button{ border:none; background:rgba(255,255,255,.12); color:#fff; border-radius:18px; padding:8px 14px; font:700 .85rem 'Inter',sans-serif; cursor:pointer; }
  .pe-stage{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px; touch-action:none; }
  .pe-stage canvas{ border-radius:10px; touch-action:none; box-shadow:0 0 0 1px rgba(255,255,255,.18); }
  .pe-tools{ background:#12211c; padding:12px 14px 6px; }
  .pe-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .pe-chips{ overflow-x:auto; }
  .pe-chip{ flex-shrink:0; border:none; border-radius:16px; padding:7px 13px; background:rgba(255,255,255,.1); color:#cfe5de; font:700 .8rem 'Inter',sans-serif; cursor:pointer; }
  .pe-chip.on{ background:#14b98d; color:#06251d; }
  .pe-ico{ flex-shrink:0; width:38px; height:38px; border:none; border-radius:50%; background:rgba(255,255,255,.12); color:#fff; font-size:1.15rem; cursor:pointer; }
  .pe-row label{ font-size:.74rem; color:#9fbdb3; width:52px; flex-shrink:0; }
  .pe-row input[type=range]{ flex:1; min-width:0; accent-color:#14b98d; }
  .pe-bottom{ background:#12211c; padding:4px 14px calc(14px + env(safe-area-inset-bottom,0px)); }
  .pe-send{ width:100%; border:none; border-radius:14px; padding:14px; background:linear-gradient(180deg,#14b98d,#0b8f6c); color:#fff; font:800 1rem 'Inter',sans-serif; cursor:pointer; }
  .pe-send:disabled{ opacity:.6; }
  .pe-note{ text-align:center; font-size:.72rem; color:#8aa89e; margin-top:7px; }
  .pv-back{ position:fixed; inset:0; z-index:310; background:#000; display:flex; align-items:center; justify-content:center; touch-action:none; }
  .pv-back[hidden]{ display:none; }
  .pv-back img{ max-width:100%; max-height:100%; object-fit:contain; transition:transform .2s; user-select:none; -webkit-user-drag:none; }
  .pv-close{ position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; z-index:2; width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,.16); color:#fff; font-size:1.1rem; cursor:pointer; }
  .pv-info{ position:absolute; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom,0px)); text-align:center; color:#cfe5de; font:600 .78rem 'Inter',sans-serif; text-shadow:0 1px 3px #000; }

  .attach-menu{
    position:absolute;
    bottom: 66px;
    left: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(5,84,60,0.15);
    padding: 8px;
    display:none;
    flex-direction:column;
    gap:2px;
    z-index:5;
  }
  .attach-menu.show{ display:flex; }
  .attach-menu button{
    display:flex; align-items:center; gap:10px;
    background:none; border:none;
    padding: 10px 12px;
    border-radius: 10px;
    font-family:'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .attach-menu button:hover{ background: var(--bg); }

  .toast{
    position:fixed;
    bottom: 90px;
    left:50%;
    transform: translateX(-50%);
    background: var(--ink);
    color:white;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.82rem;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s ease;
    z-index:10;
  }
  .toast.show{ opacity:0.95; }

  /* ---------- Chat header menu + confirm dialog ---------- */
  .friend-menu{
    position:absolute;
    top: 64px;
    right: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(5,84,60,0.18);
    padding: 6px;
    display:none;
    flex-direction:column;
    min-width: 170px;
    z-index: 20;
  }
  .friend-menu.show{ display:flex; }

<div id="rk-boot"><div class="rk-boot-spin"></div><div id="rk-boot-text">Loading...</div></div>
<script>
  // Boot overlay: covers the page's placeholder markup until the page has applied REAL (cached or live) data and calls rkReveal().
  // If the real data cannot be loaded (slow or broken internet, a failed request) the page is NEVER revealed with its placeholder
  // markup (that is what used to show old demo users and numbers). rkFail() shows a clear message with "Try again" instead.
  // If the data still arrives later, rkReveal() simply removes the message and the real page appears.
  (function(){
    var done = false, netWatch, safety;
    window.rkReveal = function(){
      if(done) return;
      done = true;
      document.documentElement.classList.remove('rk-boot');
      var o = document.getElementById('rk-boot');
      if(o) o.remove();
      clearInterval(netWatch);
      clearTimeout(safety);
    };
    window.rkFail = function(){
      if(done) return;
      var o = document.getElementById('rk-boot');
      if(!o || o.getAttribute('data-failed')) return;
      o.setAttribute('data-failed', '1');
      var btn = 'border:none;border-radius:12px;padding:12px 22px;font:700 .95rem Inter,system-ui,sans-serif;cursor:pointer;';
      var canBack = !/home\.html/.test(location.pathname) && history.length > 1;
      o.innerHTML = '<div style="font:700 1.1rem Inter,system-ui,sans-serif;color:var(--ink,#16332c)">Could not load</div>' +
        '<div style="max-width:270px;text-align:center;line-height:1.45;font:500 .92rem Inter,system-ui,sans-serif;color:var(--ink-soft,#5c7770)">Please check your internet connection and try again.</div>' +
        '<div style="display:flex;gap:10px;margin-top:4px"><button id="rk-retry" style="' + btn + 'background:var(--teal-deep,#05846a);color:#fff">Try again</button>' +
        (canBack ? '<button id="rk-back" style="' + btn + 'background:var(--teal-soft,#d3f3e8);color:var(--teal-deep,#05846a)">Back</button>' : '') + '</div>';
      document.getElementById('rk-retry').onclick = function(){ location.reload(); };
      var b = document.getElementById('rk-back'); if(b) b.onclick = function(){ history.back(); };
    };
    netWatch = setInterval(function(){
      if(done) return;
      var t = document.getElementById('rk-boot-text');
      if(!t) return;
      var bad = window.RoomKeeper && RoomKeeper.net && RoomKeeper.net.isBad();
      t.textContent = bad ? 'Please check your network connection' : 'Loading...';
    }, 500);
    safety = setTimeout(window.rkFail, window.RK_SAFETY_MS || 12000);
  })();
</script>

<script>
  // Common App Theme — applies site-wide colors/background set by the owner (separate from room themes/avatars)
  (async function loadAppTheme(){
    let hadCache = false;
    try{
      const cached = JSON.parse(localStorage.getItem('app-theme-cache') || 'null');
      if(cached){ applyAppTheme(cached); hadCache = true; }
    }catch(err){}
    try{
      const { data: theme } = await supabaseClient.from('app_theme').select('*').eq('id','global').single();
      if(theme){
        applyAppTheme(theme);
        try{ localStorage.setItem('app-theme-cache', JSON.stringify(theme)); }catch(err){}
      }
    }catch(err){ console.error('Theme load failed:', err); }
  })();
  function applyAppTheme(theme){
    if(!theme) return;
    const root = document.documentElement.style;
    if(theme.primary_color){
      const c = theme.primary_color;
      root.setProperty('--teal-deep', c);                                        // buttons, links, active icons
      root.setProperty('--teal', `color-mix(in srgb, ${c} 72%, white)`);          // lighter end of gradients
      root.setProperty('--teal-soft', `color-mix(in srgb, ${c} 15%, white)`);     // light tinted backgrounds
    }
    if(theme.background_color){ root.setProperty('--bg', theme.background_color); }
    if(theme.background_image_url){
      // .phone has its own solid white background that hides the body image on a phone screen,
      // so the picture is set on .phone itself, under a light wash so the chat list stays readable.
      const wash = 'color-mix(in srgb, var(--bg) 55%, transparent)';
      const phone = document.querySelector('.phone');
      if(phone){
        phone.style.background = `linear-gradient(${wash}, ${wash}), url('${theme.background_image_url}') center/cover no-repeat`;
      }
    }
  }

  let currentUser = null;
  let currentProfile = null;
  let friends = []; // [{id, name, avatarUrl, idNumber, lastMessage, lastAt, online}]
  let currentChatId = null;
  let messages = [];
  let currentReply = null; // { name, text }
  let onlineIds = new Set();

  async function initAuth(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){
      location.href = 'index.html';
      return false;
    }
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
    currentProfile = profile;
    return true;
  }

  function avatarHtml(avatarUrl, initial){
    return avatarUrl
      ? `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
      : initial;
  }

  function formatTimeAgo(iso){
    if(!iso) return '';
    const d = new Date(iso);
    const diffMs = Date.now() - d.getTime();
    const mins = Math.floor(diffMs / 60000);
    if(mins < 1) return 'now';
    if(mins < 60) return mins + 'm';
    const hrs = Math.floor(mins / 60);
    if(hrs < 24) return hrs + 'h';
    const days = Math.floor(hrs / 24);
    if(days < 7) return days + 'd';
    return d.toLocaleDateString();
  }

  function setupOnlinePresence(){
    const channel = supabaseClient.channel('app-online-users', {
      config: { presence: { key: currentUser.id } }
    });
    channel.on('presence', { event: 'sync' }, () => {
      const state = channel.presenceState();
      onlineIds = new Set(Object.keys(state));
      updateChatHeaderStatus();   // no list screen any more to refresh — just the current chat's online dot
    });
    channel.subscribe(async (status) => {
      if(status === 'SUBSCRIBED'){
        await channel.track({ id: currentUser.id });
      }
    });
  }

  // the game button next to the message box opens the same Ludo lobby as Play on the Game page
  function openGameLobby(){ location.href = 'ludo.html' + (currentChatId ? '?invite=' + encodeURIComponent(currentChatId) : ''); }

  function paintTrackBar(){
    const bar = document.getElementById('track-bar');
    if(!bar) return;
    const g = (currentChatId !== null && window.Track && Track.getGame) ? Track.getGame(currentChatId) : null;
    const t = (!g && currentChatId !== null && window.Track) ? Track.get(currentChatId) : null;
    bar.classList.toggle('show', !!(t || g));
    const b = bar.querySelector('button');
    if(g){ b.dataset.game = g.game_id; b.dataset.follow = String(currentChatId); b.dataset.room = ''; b.textContent = '\u{1F441} Spectate your friend\'s game'; b.title = 'Watch live'; }
    else if(t){ b.dataset.game = ''; b.dataset.room = t.room_id; b.textContent = '\u{1F4CD} Track your friend'; b.title = t.room_name || ''; }
  }
  if(window.Track) Track.onChange(paintTrackBar);

  function updateChatHeaderStatus(){
    if(currentChatId === null) return;
    const statusEl = document.querySelector('.chat-header .status');
    if(statusEl) statusEl.textContent = onlineIds.has(currentChatId) ? 'Online' : 'Offline';
  }

  async function loadFriends(){
    const { data: rows } = await supabaseClient
      .from('friend_requests')
      .select('id, from_user, to_user, from_profile:from_user(id, name, avatar_url, id_number), to_profile:to_user(id, name, avatar_url, id_number)')
      .eq('status', 'accepted')
      .or(`from_user.eq.${currentUser.id},to_user.eq.${currentUser.id}`);

    const { data: msgs } = await supabaseClient
      .from('direct_messages')
      .select('*')
      .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
      .order('created_at', { ascending: false });

    const lastByPartner = {};
    (msgs || []).forEach(m => {
      const partnerId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
      if(!lastByPartner[partnerId]) lastByPartner[partnerId] = m;
    });

    friends = (rows || []).map(r => {
      const isMeFrom = r.from_user === currentUser.id;
      const other = isMeFrom ? r.to_profile : r.from_profile;
      const last = lastByPartner[other.id];
      return {
        id: other.id,
        name: other.name || 'Unknown',
        avatarUrl: other.avatar_url || null,
        idNumber: other.id_number || '',
        lastMessage: last ? TextPolicy.preview(TextPolicy.clean(last.content, 'message')) : 'Say hi 👋',
        lastAt: last ? last.created_at : null
      };
    }).sort((a, b) => {
      if(!a.lastAt && !b.lastAt) return 0;
      if(!a.lastAt) return 1;
      if(!b.lastAt) return -1;
      return new Date(b.lastAt) - new Date(a.lastAt);
    });

    // No list screen here any more — the friend list lives on home.html's Social tab.
    // If the person we're chatting with was removed as a friend while we're open, leave the chat.
    if(currentChatId && !findFriend(currentChatId)) closeChat();
  }

  function findFriend(id){
    return friends.find(f => f.id === id);
  }

  let profileModalToken = 0;
  function openProfileModal(idOrName){
    let f = findFriend(idOrName);
    if(!f) f = friends.find(x => x.name === idOrName);
    if(!f) return;
    const pillsEl = document.getElementById('profile-modal-pills'), bioEl = document.getElementById('profile-modal-bio');
    ProfileExtras.render(pillsEl, bioEl, null);
    Safety.renderButtons(document.getElementById('profile-modal-safety'), { userId: f.id, name: f.name });
    const token = ++profileModalToken;
    ProfileExtras.load({ userId: f.id, idNumber: f.idNumber }).then(extras => {
      if(token === profileModalToken && extras) ProfileExtras.render(pillsEl, bioEl, extras);
    });
    document.getElementById('profile-modal-avatar').innerHTML = avatarHtml(f.avatarUrl, TextPolicy.initial(f.name));
    document.getElementById('profile-modal-avatar').setAttribute('data-fr', f.id);   // their frame
    document.getElementById('profile-modal-name').textContent = f.name;
    document.getElementById('profile-modal-id').textContent = 'ID: ' + (f.idNumber || '—');
    document.getElementById('profile-modal').classList.add('show');
  }
  function closeProfileModal(){
    profileModalToken++;
    document.getElementById('profile-modal').classList.remove('show');
  }

  async function openChat(id){
    currentChatId = id;
    const f = findFriend(id);
    if(!f) return;
    document.getElementById('chat-name').textContent = f.name;
    document.getElementById('chat-avatar').innerHTML = avatarHtml(f.avatarUrl, TextPolicy.initial(f.name));
    document.getElementById('chat-avatar').setAttribute('data-fr', f.id);   // their frame
    const chatPills = document.getElementById('chat-pills');
    chatPills.setAttribute('data-pf', f.id);
    chatPills.style.display = 'none';
    ProfileExtras.fillIn(chatPills.parentNode);   // flag + gender + birthday under the friend's name
    updateChatHeaderStatus();
    paintTrackBar();
    cancelReply();
    applyChatBlockState();
    Safety.load();                 // fresh block list; the bar updates by itself when it arrives
    Notify.markChatRead(id);       // opening the chat = read: the red number goes away
    await loadMessages(id);
  }

  // Blocked (either way): the old chat stays, only the writing bar is replaced by a notice.
  function applyChatBlockState(){
    const bar = document.getElementById('block-bar'), composer = document.getElementById('composer');
    if(!bar || !composer) return;
    const id = currentChatId;
    const mine = Safety.isBlocked(id), theirs = Safety.isBlockedBy(id);
    if(!id || (!mine && !theirs)){
      bar.style.display = 'none'; bar.innerHTML = '';
      composer.style.display = 'flex';
      return;
    }
    cancelReply();
    composer.style.display = 'none';
    bar.style.display = 'flex';
    bar.innerHTML = mine
      ? '<span>You blocked this person. Unblock to send messages.</span><button type="button" onclick="unblockCurrentChat()">Unblock</button>'
      : "<span>This person has blocked you. You can't send messages.</span>";
  }
  async function unblockCurrentChat(){
    const f = findFriend(currentChatId);
    if(f) await Safety.unblock(f.id, f.name);
  }
  Safety.onChange(applyChatBlockState);

  // ---------- Chat header menu: delete friend ----------
  function toggleFriendMenu(e){

  function askDeleteFriend(){

  function closeChat(){
    // This page only ever shows one conversation — there is no inbox list screen any more.
    // The friend list lives on home.html's Social tab (Message / Friends / Requests), which is
    // where the Back arrow (and RoomKeeper's Back handling) should land.

  async function loadMessages(friendId){
    const { data } = await supabaseClient
      .from('direct_messages')
      .select('*')
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`)
      .order('created_at', { ascending: true })
      .limit(200);
    messages = (data || []).map(m => ({
      id: m.id,
      from: m.sender_id === currentUser.id ? 'me' : 'them',
      text: TextPolicy.preview(TextPolicy.clean(m.content, 'message')),   // older rows may predate the policy
      roomId: TextPolicy.roomShareId(TextPolicy.clean(m.content, 'message')),
      ludoId: TextPolicy.ludoInviteId(TextPolicy.clean(m.content, 'message')),
      imgId: TextPolicy.imageId(TextPolicy.clean(m.content, 'message')),
      voice: TextPolicy.voiceParse(TextPolicy.clean(m.content, 'message')),
      time: new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      replyTo: null
    }));
    await loadSharedRooms(messages);
    await loadLudoCards(messages);
    await loadPhotoCards(messages);
    renderMessages();
  }

  function subscribeMessages(){
    supabaseClient.channel('direct-messages-inbox')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages' }, payload => {
        const m = payload.new;
        const involvesMe = m.sender_id === currentUser.id || m.receiver_id === currentUser.id;
        if(!involvesMe) return;
        const partnerId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
        if(currentChatId === partnerId){
          loadMessages(currentChatId);
          if(m.sender_id === partnerId) Notify.markChatRead(partnerId);   // I am looking at it, so it is read
        }
        loadFriends();
      })
      .subscribe();
  }

  // ---------- shared room cards ----------
  const roomCache = {};   // roomId -> { id, name, picture_url } (null = room no longer exists)
  let rsSuppress = false;  // a long press or swipe must not also "tap" the card
  async function loadSharedRooms(list){
    const ids = [...new Set(list.filter(m => m.roomId).map(m => m.roomId))].filter(id => !(id in roomCache));
    if(!ids.length) return;
    const { data } = await supabaseClient.from('rooms').select('id, name, picture_url').in('id', ids);
    ids.forEach(id => { roomCache[id] = null; });
    (data || []).forEach(r => { roomCache[String(r.id)] = r; });
  }
  function roomCardHtml(m){
    const r = roomCache[m.roomId];
    const name = r ? r.name : 'Room not available';
    const pic = r && r.picture_url ? `<img src="${escapeHtml(r.picture_url)}" alt="">` : escapeHtml(TextPolicy.initial(name));
    return `<div class="bubble room-card" onclick="openSharedRoom('${escapeHtml(m.roomId)}')">
      <div class="rsc"><div class="rsc-pic">${pic}</div>
        <div class="rsc-info"><div class="rsc-name" dir="auto">${escapeHtml(name)}</div><div class="rsc-id">ID:${escapeHtml(m.roomId)}</div></div></div>
      <div class="rsc-tap"><span class="rsc-hand">👆</span>Tap to enter the room</div>
      <div class="bubble-time">${m.time}</div></div>`;
  }
  // ---------- Ludo invitation cards ----------
  const ludoCache = {};   // game id -> info from the server (null = no longer available)
  let ludoBusy = false;
  function shortCoins(n){
    n = Number(n) || 0;
    const f = (v, u) => (Math.round(v * 10) / 10).toString().replace(/\.0$/, '') + u;
    return n >= 1e6 ? f(n / 1e6, 'M') : n >= 1e3 ? f(n / 1e3, 'K') : String(n);
  }
  async function loadLudoCards(list){
    const ids = [...new Set(list.filter(m => m.ludoId).map(m => m.ludoId))].slice(-12);
    if(!ids.length) return;
    await Promise.all(ids.map(async id => {
      try{ const { data, error } = await supabaseClient.rpc('ludo_invite_info', { p_game: id }); ludoCache[id] = error ? null : (data || null); }
      catch(e){ ludoCache[id] = null; }
    }));
  }
  function ludoCardHtml(m){
    const i = ludoCache[m.ludoId];
    let sub, chips = '', action;
    if(!i){
      sub = 'This invitation is no longer available.';
      action = '<div class="lgc-note">Invitation ended</div>';
    } else {
      sub = i.is_host ? 'You invited friends to play' : escapeHtml(i.host_name || 'A friend') + ' invited you to play';
      chips = '<span class="lgc-chip">' + i.seats + ' players</span><span class="lgc-chip">Bet ' + shortCoins(i.bet) + '</span><span class="lgc-chip">' + i.players + '/' + i.seats + ' joined</span>';
      if(i.status === 'waiting' && i.joined) action = '<button class="lgc-btn" onclick="ludoCardPlay(\'' + escapeHtml(m.ludoId) + '\')">Open game</button>';
      else if(i.status === 'waiting' && i.invited && i.players < i.seats) action = '<button class="lgc-btn" onclick="ludoCardPlay(\'' + escapeHtml(m.ludoId) + '\')">Play</button>';
      else if(i.status === 'waiting') action = '<div class="lgc-note">Game is full</div>';
      else if(i.status === 'playing') action = i.joined ? '<button class="lgc-btn" onclick="ludoCardPlay(\'' + escapeHtml(m.ludoId) + '\')">Open game</button>' : '<div class="lgc-note">Game already started</div>';
      else action = '<div class="lgc-note">Invitation ended</div>';
    }
    return `<div class="bubble ludo-card">
      <div class="lgc-top"><div class="lgc-ico">🎲</div><div style="min-width:0"><div class="lgc-ttl">Ludo invitation</div><div class="lgc-sub" dir="auto">${sub}</div></div></div>
      <div class="lgc-chips">${chips}</div>${action}
      <div class="bubble-time">${m.time}</div></div>`;
  }
  async function ludoCardPlay(id){
    if(rsSuppress){ rsSuppress = false; return; }
    if(ludoBusy) return;
    const info = ludoCache[id];
    if(info && info.joined){ location.href = 'ludo.html'; return; }
    ludoBusy = true;
    const { error } = await supabaseClient.rpc('ludo_invite_join', { p_game: id });
    ludoBusy = false;
    if(error){
      const msg = String(error.message || '');
      if(/not enough coins/i.test(msg)) showCoinsModal(info ? info.bet : 0);
      else showToast(msg.replace(/^.*?:\s*/, '') || 'Could not join the game.');
      if(currentChatId !== null) loadMessages(currentChatId);
      return;
    }
    location.href = 'ludo.html';
  }
  function showCoinsModal(bet){
    document.getElementById('lc-text').innerHTML = 'You need <b>' + shortCoins(bet) + '</b> coins to join this game. Add coins to your wallet and try again.';
    document.getElementById('lc-back').classList.add('show');
  }
  function closeCoinsModal(){ document.getElementById('lc-back').classList.remove('show'); }

  function openSharedRoom(id){
    if(rsSuppress){ rsSuppress = false; return; }
    if(!roomCache[id]){ showToast('This room is no longer available.'); return; }

  function renderMessages(){
    const box = document.getElementById('messages');
    box.innerHTML = messages.map((m, i) => bubbleHtml(m, i)).join('');

  function bubbleHtml(m, i){
    const senderName = m.from === 'me' ? (currentProfile?.name || 'You') : (findFriend(currentChatId)?.name || 'Them');
    const quoted = m.replyTo ? `<div class="quoted-reply"><div class="q-name">${escapeHtml(m.replyTo.name)}</div>${escapeHtml(m.replyTo.text)}</div>` : '';
    return `<div class="bubble-row ${m.from === 'me' ? 'me' : 'them'}" data-index="${i}" data-name="${escapeHtml(senderName)}" data-text="${escapeHtml(m.text)}">
      <div class="bubble-row-inner">
        <div class="reply-icon">↩</div>
        ${m.roomId ? roomCardHtml(m) : m.ludoId ? ludoCardHtml(m) : m.imgId ? photoCardHtml(m) : m.voice ? `<div class="bubble">${VoiceMsg.bubbleHtml(m.voice.path, m.voice.secs)}<div class="bubble-time">${m.time}</div></div>` : `<div class="bubble">${quoted}${escapeHtml(m.text)}<div class="bubble-time">${m.time}</div></div>`}
      </div>
    </div>`;
  }

  function attachSwipeHandlers(){
    document.querySelectorAll('.bubble-row').forEach(row => {
      const inner = row.querySelector('.bubble-row-inner');
      const icon = row.querySelector('.reply-icon');
      const isMe = row.classList.contains('me');
      let startX = 0, dragging = false, dx = 0, pressTimer = null;

      function clearPressTimer(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } }
      function start(x){
        startX = x; dragging = true; dx = 0; rsSuppress = false;
        clearPressTimer();
        // Holding still (not swiping) for a moment opens Copy / Reply / Delete for this message.
        pressTimer = setTimeout(() => { rsSuppress = true; openMsgMenu(row); dragging = false; }, 480);
      }
      function move(x){
        if(!dragging) return;
        dx = x - startX;
        if(Math.abs(dx) > 8){ clearPressTimer(); rsSuppress = true; }   // it's a swipe, not a long press
        const valid = isMe ? dx < 0 : dx > 0;
        const clamped = valid ? Math.max(Math.min(dx, 60), -60) : 0;
        inner.style.transform = `translateX(${clamped}px)`;
        icon.classList.toggle('show', Math.abs(clamped) > 24);
      }
      function end(){
        clearPressTimer();
        if(!dragging) return;
        dragging = false;
        const valid = isMe ? dx < -40 : dx > 40;
        if(valid){
          startReply(row.dataset.name, row.dataset.text);
        }
        inner.style.transform = 'translateX(0)';
        icon.classList.remove('show');
        dx = 0;
      }

      inner.addEventListener('touchstart', e => start(e.touches[0].clientX), {passive:true});
      inner.addEventListener('touchmove', e => move(e.touches[0].clientX), {passive:true});
      inner.addEventListener('touchend', end);
      inner.addEventListener('mousedown', e => start(e.clientX));
      inner.addEventListener('mousemove', e => move(e.clientX));
      inner.addEventListener('mouseup', end);
      inner.addEventListener('mouseleave', end);
      inner.addEventListener('contextmenu', e => e.preventDefault());   // our own menu replaces the browser's
    });
  }

  // ---------- Long-press menu on a message: Copy / Reply / Delete ----------
  let msgMenuIndex = null;
  function openMsgMenu(row){
    const i = parseInt(row.dataset.index, 10);
    if(Number.isNaN(i) || !messages[i]) return;
    msgMenuIndex = i;

  }
  function closeMsgMenu(){
    document.getElementById('msg-menu').classList.remove('show');
  }
  function msgMenuCopy(){
    const m = messages[msgMenuIndex];
    closeMsgMenu();
    if(!m) return;
    navigator.clipboard?.writeText(m.text).then(
      () => showToast('Copied'),
      () => showToast('Could not copy')
    );
  }
  function msgMenuReport(){
    const m = messages[msgMenuIndex];
    closeMsgMenu();
    const f = findFriend(currentChatId);
    if(!m || !f) return;

  function chatMenuReport(){
    document.getElementById('friend-menu').classList.remove('show');
    const f = findFriend(currentChatId);
    if(f) Safety.report({ userId: f.id, name: f.name });
  }
  async function chatMenuBlock(){
    document.getElementById('friend-menu').classList.remove('show');
    const f = findFriend(currentChatId);
    if(!f) return;
    if(Safety.isBlocked(f.id)) await Safety.unblock(f.id, f.name);
    else await Safety.block(f.id, f.name);        // the chat stays; the message bar is replaced by a notice
  }
  function msgMenuReply(){
    const m = messages[msgMenuIndex];
    closeMsgMenu();
    if(!m) return;
    const senderName = m.from === 'me' ? (currentProfile?.name || 'You') : (findFriend(currentChatId)?.name || 'Them');
    startReply(senderName, m.text);
  }
  function askDeleteMessage(){
    closeMsgMenu();
    if(msgMenuIndex == null || !messages[msgMenuIndex]) return;
    document.getElementById('delete-msg-dialog').classList.add('show');
  }
  function closeDeleteMsgDialog(){
    document.getElementById('delete-msg-dialog').classList.remove('show');
  }
  async function confirmDeleteMessage(){
    const m = messages[msgMenuIndex];
    if(!m || !m.id) { closeDeleteMsgDialog(); return; }
    const btn = document.getElementById('delete-msg-dialog-btn');
    btn.disabled = true;
    const { error } = await supabaseClient.from('direct_messages').delete().eq('id', m.id);
    btn.disabled = false;
    closeDeleteMsgDialog();
    if(error){ showToast(error.message || 'Could not delete the message.'); return; }
    if(m.voice && m.from === 'me'){ try{ supabaseClient.storage.from('voice-messages').remove([m.voice.path]); }catch(err){} }
    if(m.imgId && m.from === 'me'){ deleteMyPhoto(m.imgId); }
    messages = messages.filter(x => x.id !== m.id);
    renderMessages();
    showToast('Message deleted');
  }

  function startReply(name, text){
    currentReply = { name, text };
    document.getElementById('rp-name').textContent = name;
    document.getElementById('rp-text').textContent = text;
    document.getElementById('reply-preview-bar').classList.add('show');
    document.getElementById('text-input').focus();
  }

  function cancelReply(){
    currentReply = null;
    document.getElementById('reply-preview-bar').classList.remove('show');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function sendText(){
    const input = document.getElementById('text-input');
    const value = TextPolicy.clean(input.value, 'message');
    if(!value || currentChatId === null) return;
    if(Safety.isBlocked(currentChatId) || Safety.isBlockedBy(currentChatId)){ applyChatBlockState(); return; }
    input.value = '';
    input.dispatchEvent(new Event('input'));    // the mic comes back when the box is empty
    cancelReply();
    const { error } = await supabaseClient.from('direct_messages').insert({
      sender_id: currentUser.id,
      receiver_id: currentChatId,
      content: value
    });
    if(error){
      if(/row-level security|violates/i.test(error.message || '')){
        showToast('You are no longer friends with this person.');
        await loadFriends();
        if(!findFriend(currentChatId)) closeChat();
      } else if(/cannot message/i.test(error.message || '')){
        showToast('You cannot message this person.');
        Safety.load();
      } else {
        showToast('Could not send message.');
      }
    } else {
      loadMessages(currentChatId);
    }
  }

  // sends a ready-made message (used for voice messages); true if it was saved
  async function sendRaw(content){
    if(currentChatId === null) return false;
    if(Safety.isBlocked(currentChatId) || Safety.isBlockedBy(currentChatId)){ applyChatBlockState(); return false; }
    const { error } = await supabaseClient.from('direct_messages').insert({ sender_id: currentUser.id, receiver_id: currentChatId, content: content });
    if(error){
      if(/row-level security|violates/i.test(error.message || '')){ showToast('You are no longer friends with this person.'); await loadFriends(); if(!findFriend(currentChatId)) closeChat(); }
      else if(/cannot message/i.test(error.message || '')){ showToast('You cannot message this person.'); Safety.load(); }
      else showToast('Could not send message.');
      return false;
    }
    loadMessages(currentChatId);
    return true;
  }
  VoiceMsg.init({
    mic: document.getElementById('mic-btn'), send: document.getElementById('send-btn'), input: document.getElementById('text-input'), composer: document.getElementById('composer'),
    getReceiver: () => currentChatId, me: () => currentUser.id, toast: showToast,
    onSend: (path, secs) => sendRaw(TextPolicy.voiceText(path, secs))
  });

  TextPolicy.bind(document.getElementById('text-input'), 'message');   // same policy while typing / pasting
  document.getElementById('text-input').addEventListener('keydown', function(e){

  document.getElementById('file-input-image').addEventListener('change', function(){

  // =====================================================================
  // PHOTOS: pick -> edit (crop / zoom / rotate / light) -> private bucket -> card in the chat. Every photo disappears after 7 days.
  // =====================================================================
  const PHOTO_BUCKET = 'chat-photos';
  const photoCache = {};     // photo id -> { row, thumbUrl, at }

  function photoIsLive(row){ return !!row && !row.deleted_at && new Date(row.expires_at) > new Date(); }
  function photoLeftText(row){
    const ms = new Date(row.expires_at) - Date.now();
    const d = Math.ceil(ms / 86400000);
    return ms <= 0 ? 'Expired' : d <= 1 ? 'Disappears today' : 'Disappears in ' + d + ' days';
  }
  async function loadPhotoCards(list){
    const ids = [...new Set(list.filter(m => m.imgId).map(m => m.imgId))].slice(-30);
    const need = ids.filter(id => !photoCache[id] || Date.now() - photoCache[id].at > 50 * 60 * 1000);
    if(!need.length) return;
    try{
      const { data: rows } = await supabaseClient.from('chat_photos').select('id, path, thumb_path, width, height, expires_at, deleted_at').in('id', need);
      const byId = {}; (rows || []).forEach(r => { byId[r.id] = r; });
      const live = need.filter(id => photoIsLive(byId[id]));
      const urls = {};
      if(live.length){
        const { data: signed } = await supabaseClient.storage.from(PHOTO_BUCKET).createSignedUrls(live.map(id => byId[id].thumb_path), 3600);
        (signed || []).forEach(x => { if(x && x.signedUrl && x.path) urls[x.path] = x.signedUrl; });
      }
      need.forEach(id => { const r = byId[id] || null; photoCache[id] = { row: r, thumbUrl: r ? (urls[r.thumb_path] || null) : null, at: Date.now() }; });
    }catch(e){ need.forEach(id => { if(!photoCache[id]) photoCache[id] = { row: null, thumbUrl: null, at: Date.now() - 49 * 60 * 1000 }; }); }
  }
  function photoCardHtml(m){
    const c = photoCache[m.imgId], r = c && c.row;
    if(!(photoIsLive(r) && c.thumbUrl)){
      return `<div class="bubble photo-card gone"><div class="ph-gone"><div class="ph-gico">📷</div><div>Photo expired</div><small>Photos disappear after 7 days</small></div><div class="ph-foot"><span></span><span class="bubble-time">${m.time}</span></div></div>`;
    }
    const ar = (r.width && r.height) ? Math.min(Math.max(r.width / r.height, 0.6), 1.8) : 1;
    return `<div class="bubble photo-card" onclick="openPhoto('${escapeHtml(m.imgId)}')"><div class="ph-wrap" style="aspect-ratio:${ar.toFixed(3)}"><img src="${escapeHtml(c.thumbUrl)}" alt="Photo" draggable="false"></div><div class="ph-foot"><span class="ph-exp">⏳ ${photoLeftText(r)}</span><span class="bubble-time">${m.time}</span></div></div>`;
  }
  async function openPhoto(id){
    const c = photoCache[id]; if(!c || !photoIsLive(c.row)) return;
    const { data, error } = await supabaseClient.storage.from(PHOTO_BUCKET).createSignedUrl(c.row.path, 600);
    if(error || !data) { showToast('Could not open the photo'); return; }
    const img = document.getElementById('pv-img');
    img.style.transform = ''; img.dataset.z = '0'; img.src = data.signedUrl;
    document.getElementById('pv-info').textContent = photoLeftText(c.row);
    document.getElementById('pv-back').hidden = false; document.body.classList.add('pe-open');
  }
  function closePhoto(){ document.getElementById('pv-back').hidden = true; document.getElementById('pv-img').removeAttribute('src'); document.body.classList.remove('pe-open'); }
  document.getElementById('pv-img').addEventListener('dblclick', function(){ const z = this.dataset.z === '1'; this.dataset.z = z ? '0' : '1'; this.style.transform = z ? '' : 'scale(2.2)'; });
  async function deleteMyPhoto(id){
    const c = photoCache[id], r = c && c.row; if(!r) return;
    try{ await supabaseClient.storage.from(PHOTO_BUCKET).remove([r.path, r.thumb_path]); await supabaseClient.from('chat_photos').delete().eq('id', id); }catch(e){}
    delete photoCache[id];
  }

  // ---------- the editor ----------
  const PE = { img: null, rot: 0, aspect: 0, zoom: 1, px: 0, py: 0, bri: 100, con: 100, cw: 0, ch: 0, busy: false, to: null, ptr: new Map(), pinch: 0 };
  const $pe = id => document.getElementById(id);
  function peDims(){ const odd = PE.rot % 2 === 1; return { iw: odd ? PE.img.height : PE.img.width, ih: odd ? PE.img.width : PE.img.height }; }
  function peScale(){ const d = peDims(); return Math.max(PE.cw / d.iw, PE.ch / d.ih) * PE.zoom; }
  function peClamp(){
    const d = peDims(), sc = peScale();
    const mx = Math.max(0, (d.iw * sc - PE.cw) / 2), my = Math.max(0, (d.ih * sc - PE.ch) / 2);
    PE.px = Math.max(-mx, Math.min(mx, PE.px)); PE.py = Math.max(-my, Math.min(my, PE.py));
  }
  function peLayout(){
    const stage = $pe('pe-stage'), d = peDims();
    const aw = Math.max(120, stage.clientWidth - 16), ah = Math.max(120, stage.clientHeight - 16);
    const ar = PE.aspect || d.iw / d.ih;
    let cw = aw, ch = cw / ar; if(ch > ah){ ch = ah; cw = ch * ar; }
    PE.cw = Math.round(cw); PE.ch = Math.round(ch);
    const cv = $pe('pe-canvas'), dpr = window.devicePixelRatio || 1;
    cv.style.width = PE.cw + 'px'; cv.style.height = PE.ch + 'px'; cv.width = Math.round(PE.cw * dpr); cv.height = Math.round(PE.ch * dpr);
    peClamp();
  }
  function peDrawTo(ctx, k){
    const sc = peScale() * k;
    ctx.save();
    if('filter' in ctx) ctx.filter = 'brightness(' + PE.bri + '%) contrast(' + PE.con + '%)';
    ctx.translate(PE.cw * k / 2 + PE.px * k, PE.ch * k / 2 + PE.py * k);
    ctx.rotate(PE.rot * Math.PI / 2); ctx.scale(sc, sc);
    ctx.drawImage(PE.img, -PE.img.width / 2, -PE.img.height / 2);
    ctx.restore();
  }
  function peDraw(){
    if(!PE.img) return;
    const cv = $pe('pe-canvas'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    peDrawTo(ctx, 1);
  }
  function peSync(){
    $pe('pe-zoom').value = PE.zoom; $pe('pe-bri').value = PE.bri; $pe('pe-con').value = PE.con;
    document.querySelectorAll('#pe-aspects .pe-chip').forEach(b => b.classList.toggle('on', Math.abs(parseFloat(b.dataset.a) - PE.aspect) < 0.001));
  }
  async function peOpen(file){
    if(currentChatId === null) return;
    if(!/^image\//.test(file.type || '')){ showToast('Please choose a photo'); return; }
    let bmp; try{ bmp = await createImageBitmap(file); }catch(e){ showToast('Could not open this photo'); return; }
    Object.assign(PE, { img: bmp, rot: 0, aspect: 0, zoom: 1, px: 0, py: 0, bri: 100, con: 100, busy: false, to: currentChatId });
    $pe('pe-send').disabled = false; $pe('pe-send').textContent = 'Send photo';
    $pe('pe-back').hidden = false; document.body.classList.add('pe-open');
    peSync(); peLayout(); peDraw();
  }
  function peClose(){ if(PE.busy) return; $pe('pe-back').hidden = true; document.body.classList.remove('pe-open'); if(PE.img && PE.img.close) PE.img.close(); PE.img = null; }
  function peRender(maxSide, quality){
    const k = Math.min(maxSide / Math.max(PE.cw, PE.ch), 1 / peScale());          // never blow the photo up beyond its real pixels
    const w = Math.max(1, Math.round(PE.cw * k)), h = Math.max(1, Math.round(PE.ch * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    peDrawTo(ctx, w / PE.cw);
    return new Promise(res => cv.toBlob(b => res({ blob: b, w: w, h: h }), 'image/jpeg', quality));
  }
  async function peSend(){
    if(PE.busy || !PE.img) return;
    if(currentChatId !== PE.to){ showToast('Open the same chat to send this photo'); return; }
    PE.busy = true; const btn = $pe('pe-send'); btn.disabled = true; btn.textContent = 'Sending...';
    const to = PE.to, uid = currentUser.id;
    let id = null, path = null, tpath = null;
    try{
      let full = await peRender(1280, 0.8);
      if(full.blob && full.blob.size > 900 * 1024) full = await peRender(1280, 0.62);
      const thumb = await peRender(320, 0.72);
      if(!full.blob || !thumb.blob) throw new Error('render');
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
      path = uid + '/' + id + '.jpg'; tpath = uid + '/' + id + '_t.jpg';
      const st = supabaseClient.storage.from(PHOTO_BUCKET);
      let r = await st.upload(path, full.blob, { contentType: 'image/jpeg', upsert: false }); if(r.error) throw r.error;
      r = await st.upload(tpath, thumb.blob, { contentType: 'image/jpeg', upsert: false }); if(r.error) throw r.error;
      const ins = await supabaseClient.from('chat_photos').insert({ id: id, receiver_id: to, path: path, thumb_path: tpath, width: full.w, height: full.h });
      if(ins.error) throw ins.error;
      const ok = await sendRaw(TextPolicy.imageText(id));
      if(!ok) throw new Error('send');
      PE.busy = false; peClose();
    }catch(err){
      try{ if(path) await supabaseClient.storage.from(PHOTO_BUCKET).remove([path, tpath].filter(Boolean)); if(id) await supabaseClient.from('chat_photos').delete().eq('id', id); }catch(e2){}
      const msg = String((err && err.message) || '');
      if(msg !== 'send') showToast(/row-level|violates|policy/i.test(msg) ? 'You can only send photos to friends.' : /size|large|exceed/i.test(msg) ? 'This photo is too big.' : 'Could not send the photo. Try again.');
      PE.busy = false; btn.disabled = false; btn.textContent = 'Send photo';
    }
  }
  (function peWire(){
    $pe('pe-close').onclick = peClose;
    $pe('pe-send').onclick = peSend;
    $pe('pe-reset').onclick = () => { Object.assign(PE, { rot: 0, aspect: 0, zoom: 1, px: 0, py: 0, bri: 100, con: 100 }); peSync(); peLayout(); peDraw(); };
    $pe('pe-rl').onclick = () => { PE.rot = (PE.rot + 3) % 4; PE.px = PE.py = 0; peLayout(); peDraw(); };
    $pe('pe-rr').onclick = () => { PE.rot = (PE.rot + 1) % 4; PE.px = PE.py = 0; peLayout(); peDraw(); };
    document.querySelectorAll('#pe-aspects .pe-chip').forEach(b => b.onclick = () => { PE.aspect = parseFloat(b.dataset.a); PE.px = PE.py = 0; peSync(); peLayout(); peDraw(); });
    $pe('pe-zoom').oninput = function(){ PE.zoom = parseFloat(this.value); peClamp(); peDraw(); };
    $pe('pe-bri').oninput = function(){ PE.bri = parseInt(this.value, 10); peDraw(); };
    $pe('pe-con').oninput = function(){ PE.con = parseInt(this.value, 10); peDraw(); };
    const cv = $pe('pe-canvas');
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); PE.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); PE.pinch = 0; });
    cv.addEventListener('pointermove', e => {
      if(!PE.ptr.has(e.pointerId) || !PE.img) return;
      const prev = PE.ptr.get(e.pointerId); PE.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if(PE.ptr.size === 1){ PE.px += e.clientX - prev.x; PE.py += e.clientY - prev.y; }
      else if(PE.ptr.size === 2){
        const [a, b] = [...PE.ptr.values()], dist = Math.hypot(a.x - b.x, a.y - b.y);
        if(PE.pinch) PE.zoom = Math.max(1, Math.min(4, PE.zoom * dist / PE.pinch));
        PE.pinch = dist; $pe('pe-zoom').value = PE.zoom;
      }
      peClamp(); peDraw();
    });
    const up = e => { PE.ptr.delete(e.pointerId); PE.pinch = 0; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    window.addEventListener('resize', () => { if(PE.img && !$pe('pe-back').hidden){ peLayout(); peDraw(); } });
  })();

  function copyText(text, label){
    navigator.clipboard?.writeText(text);
    showToast((label || 'ID') + ' copied');
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  (async function init(){
    try{
      const urlParams = new URLSearchParams(location.search);
      const openId = urlParams.get('open');
      if(!openId){ location.replace('home.html'); return; }   // nothing to show on this page without a friend to chat with

      const ok = await initAuth();
      if(!ok) return;
      setupOnlinePresence();
      try{ Track.start(); }catch(err){}
      await loadFriends();
      subscribeMessages();
      openChat(openId);
      rkReveal();   // the friend and the chat are real now: safe to show the page
    }catch(err){
      console.error('Inbox init failed:', err);
      rkFail();     // never show the placeholder markup: "Could not load" + Try again
    }
  })();
</script>
