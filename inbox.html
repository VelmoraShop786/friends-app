<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-deep: #05846a;
    --teal: #06D6A0;
    --teal-soft: #d3f3e8;
    --blue: #118AB2;
    --bg: #f6faf8;
    --card: #ffffff;
    --ink: #16332c;
    --ink-soft: #5c7770;
    --line: #dfeee8;
    --bubble-them: #eef6f3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  *, *::before, *::after{
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  input, textarea{
    -webkit-user-select:text; -moz-user-select:text; -ms-user-select:text; user-select:text;
    -webkit-touch-callout:default;
  }
  .copyable, .copyable *{
    -webkit-user-select:text !important; -moz-user-select:text !important; -ms-user-select:text !important; user-select:text !important;
    -webkit-touch-callout:default !important;
  }
html, body{ overscroll-behavior-y: contain; }
  body{
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    display:flex;
    justify-content:center;
  }

  .phone{
    width:100%;
    max-width: 420px;
    min-height:100vh;
    background: var(--card);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* ---------- Chat list screen ---------- */
  #screen-list{ display:flex; flex-direction:column; flex:1; }

  .list-header{
    padding: 22px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .list-header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.6rem;
  }
  .new-chat-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background: var(--teal-deep);
    color:white;
    font-size:1.2rem;
    cursor:pointer;
  }

  .search-pill{
    margin: 0 20px 14px;
    background: var(--teal-soft);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.88rem;
    color: var(--ink-soft);
  }

  .chat-list{ flex:1; overflow-y:auto; padding: 4px 8px 20px; }
  .chat-row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 12px;
    border-radius: 14px;
    cursor:pointer;
  }
  .chat-row:hover{ background: var(--bg); }
  .chat-row .avatar{
    width: 50px; height:50px;
    border-radius:50%;
    background: var(--teal-soft);
    color: var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
    flex-shrink:0;
    position:relative;
  }
  .dot{
    position:absolute; bottom:1px; right:1px;
    width:12px; height:12px;
    background:#2ecc71;
    border:2px solid var(--card);
    border-radius:50%;
  }
  .chat-meta{ flex:1; min-width:0; }
  .chat-meta .row1{ display:flex; justify-content:space-between; align-items:baseline; }
  .chat-meta .name{ font-weight:600; font-size:0.95rem; }
  .chat-meta .time{ font-size:0.72rem; color: var(--ink-soft); flex-shrink:0; }
  .chat-meta .preview{
    font-size:0.83rem; color: var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .unread-badge{
    background: var(--teal-deep);
    color:white;
    font-size:0.7rem;
    font-weight:700;
    min-width:20px; height:20px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    padding: 0 6px;
    flex-shrink:0;
  }

  /* ---------- Conversation screen ---------- */
  #screen-chat{ display:none; flex-direction:column; flex:1; height:100vh; }

  .chat-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 16px 16px;
    border-bottom: 1px solid var(--line);
  }
  .chat-header .avatar{
    width:40px; height:40px;
    border-radius:50%;
    background: var(--teal-soft);
    color: var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
  }
  .chat-header .name{ font-weight:600; font-size:0.95rem; }
  .chat-header .status{ font-size:0.75rem; color: var(--teal-deep); }
  .icon-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background: transparent;
    color: var(--ink-soft);
    font-size:1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .icon-btn:hover{ background: var(--bg); }

  .messages{
    flex:1;
    overflow-y:auto;
    padding: 18px 14px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background: var(--bg);
  }
  .bubble-row{ display:flex; position:relative; touch-action: pan-y; }
  .bubble-row.me{ justify-content:flex-end; }
  .bubble-row-inner{
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: transform 0.15s ease;
    max-width:100%;
  }
  .bubble-row.me .bubble-row-inner{ flex-direction:row-reverse; }
  .reply-icon{
    width:26px; height:26px;
    border-radius:50%;
    background: var(--teal-soft);
    color: var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    opacity:0;
    transition: opacity 0.15s ease;
  }
  .reply-icon.show{ opacity:1; }
  .bubble{
    max-width: 72%;
    padding: 10px 13px;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height:1.4;
    cursor:pointer;
  }
  .bubble-row.them .bubble{
    background: var(--bubble-them);
    border-bottom-left-radius: 4px;
  }
  .bubble-row.me .bubble{
    background: var(--teal-deep);
    color:white;
    border-bottom-right-radius: 4px;
  }
  .bubble img{
    max-width: 220px;
    border-radius: 12px;
    display:block;
  }
  .bubble .reel-tag{
    display:flex; align-items:center; gap:6px;
    font-size:0.78rem;
    margin-top:6px;
    opacity:0.85;
  }
  .bubble-time{
    font-size:0.68rem;
    margin-top:4px;
    opacity:0.7;
    text-align:right;
  }
  .quoted-reply{
    border-left: 3px solid var(--teal-deep);
    background: rgba(0,0,0,0.06);
    border-radius: 8px;
    padding: 5px 8px;
    margin-bottom: 5px;
    font-size: 0.78rem;
    opacity:0.9;
  }
  .bubble-row.me .quoted-reply{ background: rgba(255,255,255,0.18); border-left-color: white; }
  .quoted-reply .q-name{ font-weight:700; }

  .reply-preview-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 8px 12px;
    margin: 0 12px;
    background: var(--teal-soft);
    border-left: 3px solid var(--teal-deep);
    border-radius: 8px 8px 0 0;
  }
  .reply-preview-bar.show{ display:flex; }
  .reply-preview-bar .rp-text{ font-size:0.8rem; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reply-preview-bar .rp-name{ font-weight:700; color: var(--teal-deep); }
  .reply-preview-bar button{
    background:none; border:none; color: var(--ink-soft); font-size:1rem; cursor:pointer; flex-shrink:0;
  }

  .composer{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    background: var(--card);
  }
  .attach-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background: var(--teal-soft);
    color: var(--teal-deep);
    font-size:1.2rem;
    cursor:pointer;
    flex-shrink:0;
  }
  .composer input[type=text]{
    flex:1;
    border: 1.5px solid var(--line);
    background: #fbfdfc;
    border-radius: 20px;
    padding: 11px 16px;
    font-family:'Inter', sans-serif;
    font-size: 0.9rem;
    outline:none;
    unicode-bidi: plaintext;
  }
  .composer input[type=text]:focus{ border-color: var(--teal); background:#fff; }
  .send-btn{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background: var(--teal-deep);
    color:white;
    font-size:1rem;
    cursor:pointer;
    flex-shrink:0;
  }
  .send-btn:hover{ background:#046c56; }

  .attach-menu{
    position:absolute;
    bottom: 66px;
    left: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(5,84,60,0.15);
    padding: 8px;
    display:none;
    flex-direction:column;
    gap:2px;
    z-index:5;
  }
  .attach-menu.show{ display:flex; }
  .attach-menu button{
    display:flex; align-items:center; gap:10px;
    background:none; border:none;
    padding: 10px 12px;
    border-radius: 10px;
    font-family:'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .attach-menu button:hover{ background: var(--bg); }

  .toast{
    position:fixed;
    bottom: 90px;
    left:50%;
    transform: translateX(-50%);
    background: var(--ink);
    color:white;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.82rem;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s ease;
    z-index:10;
  }
  .toast.show{ opacity:0.95; }

  /* ---------- Chat header menu + confirm dialog ---------- */
  .friend-menu{
    position:absolute;
    top: 64px;
    right: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(5,84,60,0.18);
    padding: 6px;
    display:none;
    flex-direction:column;
    min-width: 170px;
    z-index: 20;
  }
  .friend-menu.show{ display:flex; }
  .friend-menu button{
    background:none; border:none; text-align:left; cursor:pointer;
    padding: 12px 14px; border-radius: 10px;
    font-family:'Inter', sans-serif; font-size:0.9rem; color: var(--ink);
  }
  .friend-menu button:hover{ background: var(--bg); }
  .friend-menu button.danger{ color:#b1362f; }
  .dialog-backdrop{
    display:none; position:absolute; inset:0; z-index:60;
    background: rgba(10,25,20,0.55);
    align-items:center; justify-content:center; padding:24px;
  }
  .dialog-backdrop.show{ display:flex; }
  .dialog{ width:100%; max-width:340px; background: var(--card); border-radius:16px; padding:20px; }
  .dialog h3{ font-family:'Fraunces', serif; font-weight:600; font-size:1.1rem; margin-bottom:8px; color: var(--ink); }
  .dialog p{ font-size:0.86rem; color: var(--ink-soft); line-height:1.45; }
  .dialog-actions{ display:flex; gap:10px; margin-top:16px; }
  .dialog-actions button{
    flex:1; border:none; padding:12px; border-radius:12px; cursor:pointer;
    font-family:'Inter', sans-serif; font-weight:600; font-size:0.9rem;
  }
  .dialog-cancel{ background: var(--bg); color: var(--ink-soft); }
  .dialog-danger{ background:#b1362f; color:white; }
  .dialog-danger:disabled{ opacity:0.6; }

  .back-link{
    background:none; border:none; color: var(--ink-soft);
    font-family:'Inter', sans-serif; font-size:0.85rem;
    cursor:pointer; padding:0;
  }
  .profile-modal{
    display:none;
    position:absolute;
    inset:0;
    background: var(--card);
    z-index: 35;
    flex-direction:column;
  }
  .profile-modal.show{ display:flex; }
  .profile-modal-header{ padding: 18px; }
  .profile-modal-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top: 30px;
  }
  .profile-modal-avatar{
    width:96px; height:96px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--teal-deep), var(--teal));
    color:white;
    font-size:2rem;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:16px;
  }
  .profile-modal-name{ font-weight:700; font-size:1.2rem; color: var(--ink); margin-bottom:4px; }
  .profile-modal-id{ font-size:0.85rem; color: var(--ink-soft); }
  .copy-icon{
    display:flex; align-items:center; justify-content:center;
    color: var(--teal-deep);
    cursor:pointer;
    opacity:0.8;
  }
  .copy-icon:active{ opacity:1; }
</style>
</head>
<body>

<div class="phone">

  <!-- CHAT LIST -->
  <div id="screen-list">
    <div class="list-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="icon-btn" onclick="location.href='home.html'" title="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1>Inbox</h1>
      </div>
    </div>
    <div class="search-pill">🔍 Search your chats</div>
    <div class="chat-list" id="chat-list"></div>
  </div>

  <!-- CONVERSATION -->
  <div id="screen-chat">
    <div class="chat-header">
      <button class="icon-btn" onclick="closeChat()" title="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="avatar" id="chat-avatar" onclick="openProfileModal(document.getElementById('chat-name').textContent)" style="cursor:pointer;">A</div>
      <div style="flex:1;">
        <div class="name copyable" id="chat-name">Ayesha</div>
        <div class="status">Online</div>
      </div>
      <button class="icon-btn" title="Voice call">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1.1L6.6 10.8z"/></svg>
      </button>
      <button class="icon-btn" title="Video call">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 3.5v-11l-4 3.5z"/></svg>
      </button>
      <button class="icon-btn" id="friend-menu-btn" title="More" onclick="toggleFriendMenu(event)" style="margin-right:-8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="reply-preview-bar" id="reply-preview-bar">
      <div style="min-width:0;">
        <div class="rp-name" id="rp-name"></div>
        <div class="rp-text" id="rp-text"></div>
      </div>
      <button onclick="cancelReply()">✕</button>
    </div>

    <div class="composer">
      <button class="attach-btn" onclick="document.getElementById('file-input-image').click()">+</button>
      <input type="text" id="text-input" placeholder="Message..." dir="auto">
      <button class="send-btn" onclick="sendText()">➤</button>
    </div>
  </div>

  <input type="file" id="file-input-image" accept="image/*" style="display:none">

  <div class="profile-modal" id="profile-modal">
    <div class="profile-modal-header">
      <button class="icon-btn" onclick="closeProfileModal()" title="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="profile-modal-body">
      <div class="profile-modal-avatar" id="profile-modal-avatar">A</div>
      <div class="profile-modal-name copyable" id="profile-modal-name">Ayesha</div>
      <span class="id-row" style="display:flex;align-items:center;justify-content:center;gap:6px;">
        <div class="profile-modal-id copyable" id="profile-modal-id">ID: 208813</div>
        <span class="copy-icon" onclick="copyText(document.getElementById('profile-modal-id').textContent.replace('ID: ',''), 'ID')" title="Copy ID">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
      </span>
    </div>
  </div>

  <div class="friend-menu" id="friend-menu">
    <button class="danger" onclick="askDeleteFriend()">Delete friend</button>
  </div>

  <div class="dialog-backdrop" id="delete-dialog" onclick="if(event.target === this) closeDeleteDialog()">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="delete-dialog-title">
      <h3 id="delete-dialog-title"></h3>
      <p id="delete-dialog-text"></p>
      <div class="dialog-actions">
        <button type="button" class="dialog-cancel" onclick="closeDeleteDialog()">Cancel</button>
        <button type="button" class="dialog-danger" id="delete-dialog-btn" onclick="confirmDeleteFriend()">Delete friend</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  // Common App Theme — applies site-wide colors/background set by the owner (separate from room themes/avatars)
  (async function loadAppTheme(){
    try{
      const cached = JSON.parse(localStorage.getItem('app-theme-cache') || 'null');
      if(cached) applyAppTheme(cached);
    }catch(err){}
    const { data: theme } = await supabaseClient.from('app_theme').select('*').eq('id','global').single();
    if(theme){
      applyAppTheme(theme);
      try{ localStorage.setItem('app-theme-cache', JSON.stringify(theme)); }catch(err){}
    }
  })();
  function applyAppTheme(theme){
    if(!theme) return;
    const root = document.documentElement.style;
    if(theme.primary_color){ root.setProperty('--teal', theme.primary_color); root.setProperty('--teal-deep', theme.primary_color); }
    if(theme.background_color){ root.setProperty('--bg', theme.background_color); }
    if(theme.background_image_url){
      // .phone has its own solid white background that hides the body image on a phone screen,
      // so the picture is set on .phone itself, under a light wash so the chat list stays readable.
      const wash = 'color-mix(in srgb, var(--bg) 55%, transparent)';
      const phone = document.querySelector('.phone');
      if(phone){
        phone.style.background = `linear-gradient(${wash}, ${wash}), url('${theme.background_image_url}') center/cover no-repeat`;
      }
    }
  }

  let currentUser = null;
  let currentProfile = null;
  let friends = []; // [{id, name, avatarUrl, idNumber, lastMessage, lastAt, online}]
  let currentChatId = null;
  let messages = [];
  let currentReply = null; // { name, text }
  let onlineIds = new Set();

  async function initAuth(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){
      location.href = 'index.html';
      return false;
    }
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
    currentProfile = profile;
    return true;
  }

  function avatarHtml(avatarUrl, initial){
    return avatarUrl
      ? `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
      : initial;
  }

  function formatTimeAgo(iso){
    if(!iso) return '';
    const d = new Date(iso);
    const diffMs = Date.now() - d.getTime();
    const mins = Math.floor(diffMs / 60000);
    if(mins < 1) return 'now';
    if(mins < 60) return mins + 'm';
    const hrs = Math.floor(mins / 60);
    if(hrs < 24) return hrs + 'h';
    const days = Math.floor(hrs / 24);
    if(days < 7) return days + 'd';
    return d.toLocaleDateString();
  }

  function setupOnlinePresence(){
    const channel = supabaseClient.channel('app-online-users', {
      config: { presence: { key: currentUser.id } }
    });
    channel.on('presence', { event: 'sync' }, () => {
      const state = channel.presenceState();
      onlineIds = new Set(Object.keys(state));
      renderList();
      updateChatHeaderStatus();
    });
    channel.subscribe(async (status) => {
      if(status === 'SUBSCRIBED'){
        await channel.track({ id: currentUser.id });
      }
    });
  }

  function updateChatHeaderStatus(){
    if(currentChatId === null) return;
    const statusEl = document.querySelector('.chat-header .status');
    if(statusEl) statusEl.textContent = onlineIds.has(currentChatId) ? 'Online' : 'Offline';
  }

  async function loadFriends(){
    const { data: rows } = await supabaseClient
      .from('friend_requests')
      .select('id, from_user, to_user, from_profile:from_user(id, name, avatar_url, id_number), to_profile:to_user(id, name, avatar_url, id_number)')
      .eq('status', 'accepted')
      .or(`from_user.eq.${currentUser.id},to_user.eq.${currentUser.id}`);

    const { data: msgs } = await supabaseClient
      .from('direct_messages')
      .select('*')
      .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
      .order('created_at', { ascending: false });

    const lastByPartner = {};
    (msgs || []).forEach(m => {
      const partnerId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
      if(!lastByPartner[partnerId]) lastByPartner[partnerId] = m;
    });

    friends = (rows || []).map(r => {
      const isMeFrom = r.from_user === currentUser.id;
      const other = isMeFrom ? r.to_profile : r.from_profile;
      const last = lastByPartner[other.id];
      return {
        id: other.id,
        name: other.name || 'Unknown',
        avatarUrl: other.avatar_url || null,
        idNumber: other.id_number || '',
        lastMessage: last ? last.content : 'Say hi 👋',
        lastAt: last ? last.created_at : null
      };
    }).sort((a, b) => {
      if(!a.lastAt && !b.lastAt) return 0;
      if(!a.lastAt) return 1;
      if(!b.lastAt) return -1;
      return new Date(b.lastAt) - new Date(a.lastAt);
    });

    renderList();
  }

  function findFriend(id){
    return friends.find(f => f.id === id);
  }

  function openProfileModal(idOrName){
    let f = findFriend(idOrName);
    if(!f) f = friends.find(x => x.name === idOrName);
    if(!f) return;
    document.getElementById('profile-modal-avatar').innerHTML = avatarHtml(f.avatarUrl, (f.name || '?').charAt(0).toUpperCase());
    document.getElementById('profile-modal-name').textContent = f.name;
    document.getElementById('profile-modal-id').textContent = 'ID: ' + (f.idNumber || '—');
    document.getElementById('profile-modal').classList.add('show');
  }
  function closeProfileModal(){
    document.getElementById('profile-modal').classList.remove('show');
  }

  function renderList(){
    const list = document.getElementById('chat-list');
    if(!friends.length){
      list.innerHTML = '<p style="padding:20px; color:var(--ink-soft); font-size:0.85rem;">No conversations yet — accept a friend request to start chatting.</p>';
      return;
    }
    list.innerHTML = friends.map(f => {
      const initial = (f.name || '?').charAt(0).toUpperCase();
      const isOnline = onlineIds.has(f.id);
      return `
      <div class="chat-row" onclick="openChat('${f.id}')">
        <div class="avatar" onclick="event.stopPropagation(); openProfileModal('${f.id}')" style="cursor:pointer;">${avatarHtml(f.avatarUrl, initial)}${isOnline ? '<span class="dot"></span>' : ''}</div>
        <div class="chat-meta">
          <div class="row1"><span class="name copyable">${escapeHtml(f.name)}</span><span class="time">${formatTimeAgo(f.lastAt)}</span></div>
          <div class="row1"><span class="preview">${escapeHtml(f.lastMessage)}</span></div>
        </div>
      </div>
    `;}).join('');
  }

  async function openChat(id){
    currentChatId = id;
    const f = findFriend(id);
    if(!f) return;
    document.getElementById('chat-name').textContent = f.name;
    document.getElementById('chat-avatar').innerHTML = avatarHtml(f.avatarUrl, (f.name || '?').charAt(0).toUpperCase());
    updateChatHeaderStatus();
    document.getElementById('screen-list').style.display = 'none';
    document.getElementById('screen-chat').style.display = 'flex';
    cancelReply();
    await loadMessages(id);
  }

  // ---------- Chat header menu: delete friend ----------
  function toggleFriendMenu(e){
    e.stopPropagation();
    document.getElementById('friend-menu').classList.toggle('show');
  }
  document.addEventListener('click', () => {
    document.getElementById('friend-menu')?.classList.remove('show');
  });

  function askDeleteFriend(){
    document.getElementById('friend-menu').classList.remove('show');
    const f = findFriend(currentChatId);
    if(!f) return;
    document.getElementById('delete-dialog-title').textContent = 'Delete ' + f.name + '?';
    document.getElementById('delete-dialog-text').textContent =
      'They will be removed from your friends and this whole chat will be deleted for both of you. ' +
      'To become friends again you will have to send a new friend request.';
    document.getElementById('delete-dialog').classList.add('show');
  }
  function closeDeleteDialog(){
    document.getElementById('delete-dialog').classList.remove('show');
  }
  async function confirmDeleteFriend(){
    const id = currentChatId;
    if(!id) return;
    const btn = document.getElementById('delete-dialog-btn');
    btn.disabled = true;
    const { error } = await supabaseClient.rpc('delete_friend', { p_friend: id });
    btn.disabled = false;
    if(error){ showToast(error.message || 'Could not delete this friend.'); return; }
    closeDeleteDialog();
    closeChat();            // back to the list; it reloads without them
    showToast('Friend deleted');
  }

  function closeChat(){
    currentChatId = null;
    document.getElementById('screen-chat').style.display = 'none';
    document.getElementById('screen-list').style.display = 'flex';
    document.getElementById('attach-menu')?.classList.remove('show');
    loadFriends();
  }

  async function loadMessages(friendId){
    const { data } = await supabaseClient
      .from('direct_messages')
      .select('*')
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`)
      .order('created_at', { ascending: true })
      .limit(200);
    messages = (data || []).map(m => ({
      id: m.id,
      from: m.sender_id === currentUser.id ? 'me' : 'them',
      text: m.content,
      time: new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      replyTo: null
    }));
    renderMessages();
  }

  function subscribeMessages(){
    supabaseClient.channel('direct-messages-inbox')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages' }, payload => {
        const m = payload.new;
        const involvesMe = m.sender_id === currentUser.id || m.receiver_id === currentUser.id;
        if(!involvesMe) return;
        const partnerId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
        if(currentChatId === partnerId){
          loadMessages(currentChatId);
        }
        loadFriends();
      })
      .subscribe();
  }

  function renderMessages(){
    const box = document.getElementById('messages');
    box.innerHTML = messages.map((m, i) => bubbleHtml(m, i)).join('');
    box.scrollTop = box.scrollHeight;
    attachSwipeHandlers();
  }

  function bubbleHtml(m, i){
    const senderName = m.from === 'me' ? (currentProfile?.name || 'You') : (findFriend(currentChatId)?.name || 'Them');
    const quoted = m.replyTo ? `<div class="quoted-reply"><div class="q-name">${escapeHtml(m.replyTo.name)}</div>${escapeHtml(m.replyTo.text)}</div>` : '';
    return `<div class="bubble-row ${m.from === 'me' ? 'me' : 'them'}" data-index="${i}" data-name="${escapeHtml(senderName)}" data-text="${escapeHtml(m.text)}">
      <div class="bubble-row-inner">
        <div class="reply-icon">↩</div>
        <div class="bubble">${quoted}${escapeHtml(m.text)}<div class="bubble-time">${m.time}</div></div>
      </div>
    </div>`;
  }

  function attachSwipeHandlers(){
    document.querySelectorAll('.bubble-row').forEach(row => {
      const inner = row.querySelector('.bubble-row-inner');
      const icon = row.querySelector('.reply-icon');
      const isMe = row.classList.contains('me');
      let startX = 0, dragging = false, dx = 0;

      function start(x){ startX = x; dragging = true; }
      function move(x){
        if(!dragging) return;
        dx = x - startX;
        const valid = isMe ? dx < 0 : dx > 0;
        const clamped = valid ? Math.max(Math.min(dx, 60), -60) : 0;
        inner.style.transform = `translateX(${clamped}px)`;
        icon.classList.toggle('show', Math.abs(clamped) > 24);
      }
      function end(){
        if(!dragging) return;
        dragging = false;
        const valid = isMe ? dx < -40 : dx > 40;
        if(valid){
          startReply(row.dataset.name, row.dataset.text);
        }
        inner.style.transform = 'translateX(0)';
        icon.classList.remove('show');
        dx = 0;
      }

      inner.addEventListener('touchstart', e => start(e.touches[0].clientX), {passive:true});
      inner.addEventListener('touchmove', e => move(e.touches[0].clientX), {passive:true});
      inner.addEventListener('touchend', end);
      inner.addEventListener('mousedown', e => start(e.clientX));
      inner.addEventListener('mousemove', e => move(e.clientX));
      inner.addEventListener('mouseup', end);
      inner.addEventListener('mouseleave', end);
    });
  }

  function startReply(name, text){
    currentReply = { name, text };
    document.getElementById('rp-name').textContent = name;
    document.getElementById('rp-text').textContent = text;
    document.getElementById('reply-preview-bar').classList.add('show');
    document.getElementById('text-input').focus();
  }

  function cancelReply(){
    currentReply = null;
    document.getElementById('reply-preview-bar').classList.remove('show');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function sendText(){
    const input = document.getElementById('text-input');
    const value = input.value.trim();
    if(!value || currentChatId === null) return;
    input.value = '';
    cancelReply();
    const { error } = await supabaseClient.from('direct_messages').insert({
      sender_id: currentUser.id,
      receiver_id: currentChatId,
      content: value
    });
    if(error){
      if(/row-level security|violates/i.test(error.message || '')){
        showToast('You are no longer friends with this person.');
        await loadFriends();
        if(!findFriend(currentChatId)) closeChat();
      } else {
        showToast('Could not send message.');
      }
    } else {
      loadMessages(currentChatId);
    }
  }

  document.getElementById('text-input').addEventListener('keydown', function(e){
    if(e.key === 'Enter') sendText();
  });

  document.getElementById('file-input-image').addEventListener('change', function(){
    showToast('Sending photos is coming soon');
  });

  function copyText(text, label){
    navigator.clipboard?.writeText(text);
    showToast((label || 'ID') + ' copied');
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  (async function init(){
    const ok = await initAuth();
    if(!ok) return;
    setupOnlinePresence();
    await loadFriends();
    subscribeMessages();

    const urlParams = new URLSearchParams(location.search);
    const openId = urlParams.get('open');
    if(openId) openChat(openId);
  })();
</script>

</body>
